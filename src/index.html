<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Infotech member dashboard" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta property="og:title" content="Infotech Dashboard" />
    <meta property="og:description" content="Manage your Infotech account, packages, payments, and reports." />
    <title>Infotech — Dashboard</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-row">
          <div class="brand-mark">⌂</div>
          <div class="brand-text"><span>INFOTECH</span></div>
        </div>
        <nav class="nav-list" id="nav-list" aria-label="Primary navigation"></nav>
        <div class="sidebar-footer">© 2026 Infotech</div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-toggle" aria-label="Toggle navigation">☰</button>
          <div class="account-menu">
            <div class="account-avatar">⌂</div>
            <span id="account-name">Account</span>
            <span class="chevron">⌄</span>
          </div>
        </header>
        <section class="content" id="content"></section>
        <footer class="site-footer">© 2026 Infotech. All Rights Reserved.</footer>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" aria-label="Close">×</button>
        <div class="eyebrow">PACKAGE ACTIVATION</div>
        <h2 id="modal-title">Purchase package</h2>
        <p class="muted" id="modal-copy">Review the package details before confirming your purchase.</p>
        <div class="modal-summary" id="modal-summary"></div>
        <div class="form-field modal-password-field"><label for="purchase-transaction-password">T-Password <span>*</span></label><input id="purchase-transaction-password" class="input" type="password" autocomplete="current-password" placeholder="Enter T-Password" /></div>
        <button class="primary-button full" id="modal-confirm">Confirm purchase</button>
      </div>
    </div>
    <script src="./runtime-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
